name: Generate Snake e Estatísticas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/snake_style.py"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: nokynoy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Redesenhar a cobra
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -la dist
          python3 .github/scripts/snake_style.py dist/github-contribution-grid-snake.svg --theme light
          python3 .github/scripts/snake_style.py dist/github-contribution-grid-snake-dark.svg --theme dark

      - name: Cartão de estatísticas
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=nokynoy&show_icons=true&theme=tokyonight&include_all_commits=true&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cartão de linguagens
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=nokynoy&layout=compact&langs_count=8&theme=tokyonight&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
