name: Generate Snake e Estatísticas

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: nokynoy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Liberar a pasta dist
        # a cobra é gerada em Docker como root; sem isso o cartão de estatísticas não consegue salvar
        run: sudo chown -R "$(id -u):$(id -g)" dist

      # Para voltar a cobra redesenhada (cabeça, olhos, língua), adicione:
      #   python3 .github/scripts/snake_style.py dist/github-contribution-grid-snake.svg --theme light
      #   python3 .github/scripts/snake_style.py dist/github-contribution-grid-snake-dark.svg --theme dark

      - name: Cartão de estatísticas
        run: python3 .github/scripts/stats_card.py nokynoy dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cartão de linguagens
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=nokynoy&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&custom_title=Linguagens%20mais%20usadas
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
